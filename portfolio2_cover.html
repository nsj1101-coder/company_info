<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 480px; height: 480px; overflow: hidden; font-family: 'Pretendard', 'Apple SD Gothic Neo', sans-serif; background: #0a0a0f; }

  .cover {
    width: 480px; height: 480px;
    background: linear-gradient(135deg, #0f0c29 0%, #1a1050 40%, #24243e 100%);
    position: relative; overflow: hidden;
    display: flex; flex-direction: column; justify-content: flex-end; padding: 36px;
  }

  /* Animated grid background */
  .grid-bg {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background-image:
      linear-gradient(rgba(99,102,241,0.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(99,102,241,0.07) 1px, transparent 1px);
    background-size: 40px 40px;
  }

  /* Glow orbs */
  .orb1 {
    position: absolute; top: -60px; right: -60px;
    width: 280px; height: 280px; border-radius: 50%;
    background: radial-gradient(circle, rgba(251,146,60,0.25) 0%, transparent 70%);
  }
  .orb2 {
    position: absolute; bottom: 40px; left: -40px;
    width: 200px; height: 200px; border-radius: 50%;
    background: radial-gradient(circle, rgba(99,102,241,0.2) 0%, transparent 70%);
  }

  /* Top badge */
  .badge {
    position: absolute; top: 32px; left: 36px;
    background: rgba(251,146,60,0.15); border: 1px solid rgba(251,146,60,0.4);
    color: #fb923c; font-size: 11px; font-weight: 700; letter-spacing: 1.5px;
    padding: 5px 12px; border-radius: 4px; text-transform: uppercase;
  }

  /* Stats row top right */
  .stats {
    position: absolute; top: 28px; right: 36px;
    display: flex; flex-direction: column; align-items: flex-end; gap: 6px;
  }
  .stat-item {
    display: flex; align-items: center; gap: 6px;
    color: rgba(255,255,255,0.5); font-size: 10px;
  }
  .stat-num { color: #fb923c; font-size: 13px; font-weight: 800; }

  /* Mock UI element */
  .mock-ui {
    position: absolute; top: 80px; right: 28px;
    width: 180px; background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 14px;
  }
  .mock-header {
    display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
  }
  .mock-dot { width: 8px; height: 8px; border-radius: 50%; background: #fb923c; }
  .mock-title { font-size: 9px; color: rgba(255,255,255,0.6); font-weight: 600; }
  .mock-card {
    background: rgba(251,146,60,0.08); border: 1px solid rgba(251,146,60,0.15);
    border-radius: 6px; padding: 8px; margin-bottom: 6px;
  }
  .mock-card-title { font-size: 8px; color: rgba(255,255,255,0.7); margin-bottom: 4px; }
  .mock-progress { height: 3px; background: rgba(255,255,255,0.1); border-radius: 2px; }
  .mock-progress-fill { height: 3px; background: linear-gradient(90deg,#fb923c,#f59e0b); border-radius: 2px; width: 72%; }
  .mock-amount { font-size: 10px; color: #fb923c; font-weight: 700; margin-top: 4px; }
  .mock-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .mock-row:last-child { border: none; }
  .mock-label { font-size: 7.5px; color: rgba(255,255,255,0.4); }
  .mock-value { font-size: 7.5px; color: rgba(255,255,255,0.7); font-weight: 600; }
  .mock-tag {
    display: inline-block; background: rgba(34,197,94,0.15);
    border: 1px solid rgba(34,197,94,0.3); color: #4ade80;
    font-size: 6.5px; padding: 2px 5px; border-radius: 3px;
  }

  /* Content */
  .category { font-size: 11px; color: #fb923c; font-weight: 700; letter-spacing: 0.5px; margin-bottom: 10px; text-transform: uppercase; }
  .title { font-size: 26px; font-weight: 900; color: #fff; line-height: 1.2; margin-bottom: 12px; }
  .title span { color: #fb923c; }
  .desc { font-size: 12px; color: rgba(255,255,255,0.55); line-height: 1.6; margin-bottom: 20px; max-width: 280px; }

  /* Tech tags */
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; }
  .tag {
    font-size: 10px; font-weight: 600; padding: 4px 10px; border-radius: 4px;
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
    color: rgba(255,255,255,0.7);
  }
  .tag.hot { background: rgba(251,146,60,0.15); border-color: rgba(251,146,60,0.35); color: #fb923c; }

  /* Bottom line */
  .bottom-line {
    display: flex; align-items: center; justify-content: space-between;
    border-top: 1px solid rgba(255,255,255,0.08); padding-top: 16px;
  }
  .company { font-size: 11px; color: rgba(255,255,255,0.4); font-weight: 500; }
  .company span { color: rgba(255,255,255,0.7); font-weight: 700; }
  .arrow {
    width: 32px; height: 32px; background: #fb923c; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; color: #fff; font-weight: 700;
  }
</style>
</head>
<body>
<div class="cover">
  <div class="grid-bg"></div>
  <div class="orb1"></div>
  <div class="orb2"></div>

  <div class="badge">Marketplace Platform</div>

  <div class="stats">
    <div class="stat-item"><span class="stat-num">36</span> Tables</div>
    <div class="stat-item"><span class="stat-num">38</span> Controllers</div>
    <div class="stat-item"><span class="stat-num">C2B</span> Match</div>
  </div>

  <div class="mock-ui">
    <div class="mock-header">
      <div class="mock-dot"></div>
      <div class="mock-title">견적 매칭 현황</div>
    </div>
    <div class="mock-card">
      <div class="mock-card-title">진행 중인 입찰</div>
      <div class="mock-progress"><div class="mock-progress-fill"></div></div>
      <div class="mock-amount">₩ 4,200,000</div>
    </div>
    <div class="mock-row">
      <span class="mock-label">업체 응찰</span>
      <span class="mock-value">12개사</span>
    </div>
    <div class="mock-row">
      <span class="mock-label">상태</span>
      <span class="mock-tag">비교견적</span>
    </div>
    <div class="mock-row">
      <span class="mock-label">PG 결제</span>
      <span class="mock-value">NicePay ✓</span>
    </div>
  </div>

  <div class="category">인테리어 · 중개 매칭</div>
  <div class="title">인테리어 중개<br><span>매칭 플랫폼</span></div>
  <div class="desc">고객과 인테리어 업체를 연결하는 C2B 입찰 플랫폼. 실시간 채팅·PG 결제·포인트 시스템 풀스택 구현.</div>
  <div class="tags">
    <span class="tag hot">PHP MVC</span>
    <span class="tag hot">MySQL</span>
    <span class="tag">NicePay</span>
    <span class="tag">OAuth 2.0</span>
    <span class="tag">Tailwind CSS</span>
  </div>
  <div class="bottom-line">
    <div class="company">by <span>MaxImpact</span> · 개발+기획</div>
    <div class="arrow">→</div>
  </div>
</div>
</body>
</html>
