<style>
  :root{
    --bg:#F4F1EB;
    --ink:#1C1A17;
    --muted:#7A736B;
    --line:#E4DED4;
    --surface:#FFFFFF;
    --accent:#B0493C;
    --accent-ink:#8E392E;
    --accent-soft:#F2DED8;
    --radius:16px;
    --maxw:520px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    min-height:100svh;
    overflow-x:hidden;
    word-break:keep-all;
  }
  .wrap{
    max-width:var(--maxw);
    margin:0 auto;
    padding:0 22px;
    min-height:100svh;
    display:flex;
    flex-direction:column;
  }
  /* top progress */
  .topbar{
    position:sticky;top:0;z-index:5;
    background:linear-gradient(var(--bg) 70%, rgba(244,241,235,0));
    padding-top:16px;
  }
  .progress{
    height:3px;width:100%;background:var(--line);border-radius:99px;overflow:hidden;
  }
  .progress > i{
    display:block;height:100%;width:0%;
    background:var(--accent);border-radius:99px;
    transition:width .45s cubic-bezier(.22,.61,.36,1);
  }
  .progress-meta{
    display:flex;justify-content:space-between;align-items:center;
    font-size:12.5px;color:var(--muted);letter-spacing:.02em;
    margin-top:9px;min-height:18px;
  }
  .back{
    border:0;background:none;color:var(--muted);font:inherit;font-size:13px;
    padding:2px 0;cursor:pointer;display:inline-flex;align-items:center;gap:5px;
  }
  .back:disabled{opacity:0;pointer-events:none}
  .back:hover{color:var(--ink)}

  main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:14px 0 34px}

  .fade{animation:fade .42s cubic-bezier(.22,.61,.36,1) both}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  /* ---- intro ---- */
  .intro{text-align:left}
  .kicker{font-size:12.5px;letter-spacing:.22em;color:var(--accent);font-weight:600;text-transform:uppercase}
  .intro h1{
    font-size:clamp(27px,7.6vw,36px);line-height:1.32;font-weight:700;
    margin:16px 0 0;letter-spacing:-.02em;
  }
  .intro p.lead{color:var(--muted);font-size:15.5px;margin:18px 0 0;max-width:30em}
  .specs{display:flex;gap:8px;flex-wrap:wrap;margin:26px 0 0}
  .spec{font-size:12.5px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:6px 13px;background:var(--surface)}
  .start{margin-top:34px}

  .btn{
    appearance:none;border:0;cursor:pointer;font:inherit;
    width:100%;padding:17px 20px;border-radius:14px;
    background:var(--accent);color:#fff;font-size:16px;font-weight:600;letter-spacing:.01em;
    transition:transform .12s ease, background .2s ease;
  }
  .btn:hover{background:var(--accent-ink)}
  .btn:active{transform:scale(.985)}
  .btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
  .btn.ghost:hover{background:#fbfaf7;border-color:#d6cfc3}
  .btn-row{display:flex;gap:10px;margin-top:12px}
  .btn-row .btn{flex:1}

  /* ---- question ---- */
  .qnum{font-size:13px;color:var(--accent);font-weight:600;letter-spacing:.04em}
  .qtext{
    font-size:clamp(20px,5.6vw,24px);font-weight:700;line-height:1.45;
    margin:12px 0 24px;letter-spacing:-.01em;
  }
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{
    display:flex;align-items:flex-start;gap:13px;text-align:left;
    width:100%;padding:15px 16px;border-radius:14px;
    background:var(--surface);border:1px solid var(--line);
    font:inherit;font-size:15.5px;color:var(--ink);cursor:pointer;
    transition:border-color .18s ease, background .18s ease, transform .12s ease;
  }
  .opt:hover{border-color:#cbc3b5;background:#fbfaf7}
  .opt:active{transform:scale(.99)}
  .opt .mk{
    flex:none;width:24px;height:24px;border-radius:50%;
    border:1.5px solid var(--line);color:var(--muted);
    font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center;
    margin-top:1px;transition:all .18s ease;
  }
  .opt.sel{border-color:var(--accent);background:var(--accent-soft)}
  .opt.sel .mk{background:var(--accent);border-color:var(--accent);color:#fff}
  .opt .tx{flex:1;min-width:0;overflow-wrap:anywhere}

  /* ---- result ---- */
  .res{text-align:center}
  .res .badge{
    width:74px;height:74px;border-radius:50%;margin:0 auto;
    background:var(--accent);color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:34px;font-weight:700;letter-spacing:.01em;
    box-shadow:0 10px 30px -12px rgba(176,73,60,.6);
  }
  .res .rkicker{margin-top:18px;font-size:12.5px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase}
  .res h2{font-size:clamp(26px,7vw,32px);font-weight:700;margin:6px 0 0;letter-spacing:-.02em}
  .res .tagline{color:var(--accent-ink);font-size:15.5px;margin:12px 0 0;font-weight:500}
  .res .desc{color:var(--muted);font-size:15px;margin:16px auto 0;max-width:30em;text-align:left}
  .chips{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin:20px 0 0}
  .chip{font-size:12.5px;color:var(--accent-ink);background:var(--accent-soft);border-radius:99px;padding:5px 12px;font-weight:500}

  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px;margin:22px 0 0;text-align:left;
  }
  .card h3{font-size:13px;letter-spacing:.04em;color:var(--muted);margin:0 0 12px;font-weight:600}
  .kv{display:flex;gap:10px;font-size:14.5px;margin:0 0 10px}
  .kv:last-child{margin:0}
  .kv .k{flex:none;color:var(--accent);font-weight:600;width:74px}
  .kv .v{flex:1;min-width:0;color:var(--ink)}

  .bars{display:flex;flex-direction:column;gap:11px}
  .bar{display:grid;grid-template-columns:96px 1fr 34px;align-items:center;gap:10px;font-size:13px}
  .bar .bl{color:var(--ink);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar .bt{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
  .bar .bt > i{display:block;height:100%;background:var(--accent);border-radius:99px;width:0;transition:width .8s cubic-bezier(.22,.61,.36,1)}
  .bar.dim .bl{color:var(--muted)}
  .bar.dim .bt > i{background:#cfc7ba}
  .bar .bp{color:var(--muted);text-align:right}

  .actions{margin:26px 0 0}
  .footnote{margin:30px 0 8px;text-align:center;font-size:12px;color:var(--muted)}
  .footnote a{color:var(--muted)}
  .toast{
    position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:#fff;font-size:13.5px;padding:11px 18px;border-radius:99px;
    opacity:0;pointer-events:none;transition:opacity .25s ease, transform .25s ease;z-index:20;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>

    {l:"B",t:"“왜 좋아하는지 설명해줘.”",y:"B"},
    {l:"C",t:"“네가 좋아하는 거니까 존중할게.”",y:"C"},
    {l:"D",t:"“오, 신기하다. 더 알려줘.”",y:"D"},
    {l:"E",t:"“그 시간은 네가 충분히 즐겨.”",y:"C"}]},
  {id:20,q:"내가 가장 피하고 싶은 연애는?",o:[
    {l:"A",t:"감정 기복이 너무 큰 연애",y:"E"},
    {l:"B",t:"대화가 얕고 반복되는 연애",y:"B"},
    {l:"C",t:"사생활이 사라지는 연애",y:"C"},
    {l:"D",t:"갈등 때마다 감정싸움이 되는 연애",y:"D"},
    {l:"E",t:"방향성 없이 흘러가는 연애",y:"E"}]}
];

const RESULTS = {
  A:{name:"다정한 안정형",tag:"사랑받고 있다는 감각이 관계를 움직인다",
     desc:"표현과 확신을 중요하게 생각하는 타입. 꾸준한 애정과 ‘우리는 괜찮다’는 신호가 있을 때 가장 안정적입니다.",
     keys:["표현","확신","다정함","꾸준함"],
     good:"감정을 자주 말로 표현해주는 상대",
     caution:"확신이 없으면 혼자 불안을 키우기 쉬워요",
     fit:"지적 교감형(B) · 현실 안정형(E)"},
  B:{name:"지적 교감형",tag:"말이 통한다는 건, 세계가 통한다는 것",
     desc:"대화의 깊이와 사고방식, 세계관의 호환성을 중요하게 생각하는 타입. INTP가 가장 흥미를 느끼기 쉬운 유형입니다.",
     keys:["대화","사고방식","호기심","깊이"],
     good:"사소한 주제도 깊게 파고드는 대화",
     caution:"감정 표현을 분석으로 대체하지 않도록",
     fit:"지적 교감형(B) · 자유 존중형(C)"},
  C:{name:"자유 존중형",tag:"사랑해도, 각자의 세계는 필요하다",
     desc:"서로의 개인 시간과 독립성을 중요하게 생각하는 타입. 거리감을 지켜줄 때 오히려 더 가까워집니다.",
     keys:["독립성","개인 시간","경계","존중"],
     good:"내 시간을 존중하면서도 꾸준한 상대",
     caution:"거리를 두다 표현이 부족해 보일 수 있어요",
     fit:"자유 존중형(C) · 지적 교감형(B)"},
  D:{name:"편안한 친구형",tag:"부담이 없을 때, 관계는 깊어진다",
     desc:"장난과 자연스러움, 일상의 편안함을 중요하게 생각하는 타입. 무리하지 않는 관계에서 가장 자기다워집니다.",
     keys:["편안함","유머","자연스러움","일상"],
     good:"웃음 코드와 리듬이 맞는 상대",
     caution:"편안함에 기대 진지한 대화를 미루지 않기",
     fit:"편안한 친구형(D) · 다정한 안정형(A)"},
  E:{name:"현실 안정형",tag:"감정보다 오래갈 구조를 본다",
     desc:"책임감과 미래 계획, 신뢰를 중요하게 생각하는 타입. 감정의 높낮이보다 지속 가능한 방향을 봅니다.",
     keys:["신뢰","책임감","미래","안정"],
     good:"약속을 지키고 방향이 분명한 상대",
     caution:"계획이 앞서 감정 표현이 뒤로 밀릴 수 있어요",
     fit:"다정한 안정형(A) · 현실 안정형(E)"}
};
const ORDER = ["A","B","C","D","E"];

const app = document.getElementById('app');
const topbar = document.getElementById('topbar');
const bar = document.getElementById('bar');
const counter = document.getElementById('counter');
const backBtn = document.getElementById('back');
const toastEl = document.getElementById('toast');

let answers = []; // type per question, index-aligned
let idx = 0;      // current question index

function setProgress(){
  const done = answers.filter(Boolean).length;
  bar.style.width = (idx / QUESTIONS.length * 100) + '%';
  counter.textContent = (idx+1) + ' / ' + QUESTIONS.length;
  backBtn.disabled = idx === 0;
}

function renderIntro(){
  topbar.hidden = true;
  app.className = '';
  app.innerHTML = `
    <section class="intro fade">
      <div class="kicker">love3.kr · 연애 질문지</div>
      <h1>너는 사랑을<br/>어떻게 이해하는<br/>사람일까?</h1>
      <p class="lead">20개의 질문으로 들여다보는, 내가 연애에서 진짜 중요하게 보는 것. 감정만 묻지 않고 가치관·거리감·갈등 방식까지 살펴봅니다.</p>
      <div class="specs">
        <span class="spec">20문항</span>
        <span class="spec">약 3분</span>
        <span class="spec">결과 5유형</span>
        <span class="spec">INTP도 끝까지 OK</span>
      </div>
      <div class="start"><button class="btn" id="startBtn">시작하기</button></div>
    </section>`;
  document.getElementById('startBtn').onclick = ()=>{ idx=0; answers=[]; renderQuestion(); };
}

function renderQuestion(){
  topbar.hidden = false;
  setProgress();
  const Q = QUESTIONS[idx];
  const chosen = answers[idx];
  app.className = '';
  app.innerHTML = `
    <section class="q fade" key="${Q.id}">
      <div class="qnum">Q${idx+1}</div>
      <h2 class="qtext">${Q.q}</h2>
      <div class="opts">
        ${Q.o.map((o,i)=>`
          <button class="opt${chosen===o.y && answers._lbl?.[idx]===o.l?' sel':''}" data-i="${i}">
            <span class="mk">${o.l}</span>
            <span class="tx">${o.t}</span>
          </button>`).join('')}
      </div>
    </section>`;
  app.querySelectorAll('.opt').forEach(el=>{
    el.onclick = ()=> choose(parseInt(el.dataset.i,10), el);
  });
}

function choose(i, el){
  const Q = QUESTIONS[idx];
  answers[idx] = Q.o[i].y;
  (answers._lbl ||= [])[idx] = Q.o[i].l;
  app.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
  el.classList.add('sel');
  setTimeout(()=>{
    if(idx < QUESTIONS.length-1){ idx++; renderQuestion(); }
    else { bar.style.width='100%'; renderResult(); }
  }, 240);
}

backBtn.onclick = ()=>{ if(idx>0){ idx--; renderQuestion(); } };

function score(){
  const cnt = {A:0,B:0,C:0,D:0,E:0};
  answers.forEach(y=>{ if(y) cnt[y]++; });
  let max = -1;
  ORDER.forEach(t=>{ if(cnt[t]>max) max=cnt[t]; });
  const tied = ORDER.filter(t=>cnt[t]===max);
  // tie-break: whichever tied type the user picked earliest
  let winner = tied[0], best = Infinity;
  tied.forEach(t=>{
    const first = answers.indexOf(t);
    if(first>-1 && first<best){ best=first; winner=t; }
  });
  return {winner, cnt};
}

function renderResult(){
  topbar.hidden = true;
  const {winner, cnt} = score();
  const R = RESULTS[winner];
  const total = QUESTIONS.length;
  const rows = ORDER.map(t=>({t, n:cnt[t], pct:Math.round(cnt[t]/total*100)}))
                    .sort((a,b)=> b.n-a.n);
  app.className = '';
  app.innerHTML = `
    <section class="res fade">
      <div class="badge">${winner}</div>
      <div class="rkicker">나의 연애 유형</div>
      <h2>${R.name}</h2>
      <p class="tagline">“${R.tag}”</p>
      <p class="desc">${R.desc}</p>
      <div class="chips">${R.keys.map(k=>`<span class="chip">${k}</span>`).join('')}</div>

      <div class="card">
        <h3>이 유형은</h3>
        <div class="kv"><span class="k">잘 맞아요</span><span class="v">${R.good}</span></div>
        <div class="kv"><span class="k">조심할 점</span><span class="v">${R.caution}</span></div>
        <div class="kv"><span class="k">결이 맞는</span><span class="v">${R.fit}</span></div>
      </div>

      <div class="card">
        <h3>내 응답 분포</h3>
        <div class="bars">
          ${rows.map((r,i)=>`
            <div class="bar${i===0?'':' dim'}">
              <span class="bl">${r.t} ${RESULTS[r.t].name}</span>
              <span class="bt"><i data-w="${r.pct}"></i></span>
              <span class="bp">${r.pct}%</span>
            </div>`).join('')}
        </div>
      </div>

      <div class="actions">
        <button class="btn" id="shareBtn">결과 공유하기</button>
        <div class="btn-row">
          <button class="btn ghost" id="copyBtn">링크 복사</button>
          <button class="btn ghost" id="retryBtn">다시 하기</button>
        </div>
      </div>
      <p class="footnote">love3.kr · 너는 사랑을 어떻게 이해하는 사람일까?</p>
    </section>`;

  requestAnimationFrame(()=>{
    setTimeout(()=> app.querySelectorAll('.bar .bt > i').forEach(i=> i.style.width = i.dataset.w + '%'), 60);
  });

  const shareText = `나는 ‘${R.name}’. ${R.tag}\n너는 사랑을 어떻게 이해하는 사람일까?`;
  document.getElementById('shareBtn').onclick = async ()=>{
    const data = {title:"INTP 연애 질문지", text:shareText, url:"https://love3.kr/"};
    if(navigator.share){ try{ await navigator.share(data); }catch(e){} }
    else { copy("https://love3.kr/"); }
  };
  document.getElementById('copyBtn').onclick = ()=> copy("https://love3.kr/");
  document.getElementById('retryBtn').onclick = ()=> renderIntro();
}

function copy(text){
  navigator.clipboard?.writeText(text).then(()=>toast("링크를 복사했어요"))
    .catch(()=>toast("복사에 실패했어요"));
}
let toastTimer;
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> toastEl.classList.remove('show'), 1800);
}

renderIntro();
</script>
</body>
</html>
