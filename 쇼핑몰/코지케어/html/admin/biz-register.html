<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사업자 회원 등록 - 코지케어 Admin</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="https://unpkg.com/lucide-static@0.460.0/font/lucide.css">
  <link rel="stylesheet" href="../assets/admin/css/common.css?v=20260610c">
  <script>document.documentElement.classList.add("preload");if(localStorage.getItem("sidebar-collapsed")==="true"){document.documentElement.classList.add("sidebar-collapsed")}</script>
  <style>
    body{background:var(--bg-primary)}
    .reg-wrap{display:flex;flex-direction:column;min-height:100vh}
    .reg-header{display:flex;align-items:center;justify-content:space-between;padding:20px 28px;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--bg-card)}
    .reg-header .back-link{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;color:var(--fg-primary);cursor:pointer;text-decoration:none}
    .reg-header .head-sub{font-size:13px;color:var(--fg-muted);margin-top:2px}
    .reg-header .cancel-btn{font-size:14px;color:var(--fg-muted);cursor:pointer;font-weight:500}
    .reg-body{flex:1;display:flex;flex-direction:column;align-items:center;padding:32px 20px;overflow-y:auto}
    .reg-form{width:100%;max-width:640px;display:flex;flex-direction:column;gap:22px}
    .reg-form h2{font-size:18px;font-weight:700;color:var(--fg-primary);margin:0}
    .reg-form .reg-desc{font-size:13px;color:var(--fg-muted);margin:-14px 0 0}
    .radio-row{display:flex;flex-wrap:wrap;gap:10px}
    .radio-chip{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-card);cursor:pointer;font-size:14px;color:var(--fg-secondary)}
    .radio-chip input{accent-color:var(--accent)}
    .radio-chip:has(input:checked){border-color:var(--accent);background:var(--accent-light);color:var(--accent);font-weight:600}
    .file-box{display:flex;align-items:center;gap:12px;padding:14px;border:1px dashed var(--border);border-radius:var(--radius-sm);background:var(--bg-card);font-size:14px;color:var(--fg-muted)}
    .file-box i{font-size:18px;color:var(--accent)}
    .reg-footer-split{display:flex;justify-content:center;gap:16px;padding:24px}
    .reg-footer-split .btn{min-width:160px;padding:14px 0;font-size:16px}
  </style>
</head>
<body>
  <div class="reg-wrap">
    <div class="reg-header">
      <a href="biz-members.html" class="back-link">
        <i class="icon-chevron-left" style="font-size:18px"></i>
        <span>
          사업자 회원 등록
          <div class="head-sub">관리자가 직접 사업자를 추가합니다</div>
        </span>
      </a>
      <span class="cancel-btn" onclick="navigateTo('biz-members.html')">취소</span>
    </div>

    <div class="reg-body">
      <div class="reg-form">
        <h2>사업자 정보</h2>
        <p class="reg-desc">코지워커 SHOP 도매 거래를 위한 사업자 정보를 입력하세요</p>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">상호 <span class="required">*</span></label>
            <input class="form-input" placeholder="㈜이로움파트너">
          </div>
          <div class="form-group">
            <label class="form-label">대표 <span class="required">*</span></label>
            <input class="form-input" placeholder="대표자 이름">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">사업자번호 <span class="required">*</span></label>
          <input class="form-input" placeholder="000-00-00000">
        </div>

        <div class="form-group">
          <label class="form-label">사업자 유형 <span class="required">*</span></label>
          <div class="radio-row">
            <label class="radio-chip"><input type="radio" name="biztype" value="welfare" checked> 복지용구사업소</label>
            <label class="radio-chip"><input type="radio" name="biztype" value="internet"> 인터넷 사업소</label>
            <label class="radio-chip"><input type="radio" name="biztype" value="homecare"> 재가복지센터</label>
            <label class="radio-chip"><input type="radio" name="biztype" value="etc"> 기타 관련업체</label>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">대표 전화 <span class="required">*</span></label>
            <input class="form-input" placeholder="02-000-0000">
          </div>
          <div class="form-group">
            <label class="form-label">이메일</label>
            <input class="form-input" placeholder="biz@example.com">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">주소</label>
          <input class="form-input" placeholder="사업장 주소를 입력하세요">
        </div>

        <div class="form-group">
          <label class="form-label">사업자등록증 첨부 <span class="required">*</span></label>
          <label class="file-box" for="bizFile">
            <i class="icon-upload"></i>
            <span>PDF 또는 이미지 파일을 선택하세요 (최대 10MB)</span>
            <input id="bizFile" type="file" accept=".pdf,image/*" style="display:none">
          </label>
        </div>

        <div class="form-group">
          <label class="form-label">특이사항</label>
          <textarea class="form-textarea" placeholder="포인트율 협의·지점 정보 등 특이사항을 입력하세요"></textarea>
        </div>
      </div>
    </div>

    <div class="reg-footer-split">
      <button class="btn btn-secondary" onclick="navigateTo('biz-members.html')">취소</button>
      <button class="btn btn-primary" onclick="showSuccess('등록이 완료되었습니다','사업자 회원이 정상적으로 등록되었습니다.')"><i class="icon-check" style="font-size:16px"></i> 등록</button>
    </div>
  </div>

<script src="../assets/admin/js/common.js?v=20260610c"></script>
</body>
</html>
