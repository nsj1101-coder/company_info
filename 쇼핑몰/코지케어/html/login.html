<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>코지워커 SHOP 시안 · 로그인</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
  :root {
    --ink: #0f172a;
    --muted: #6b7280;
    --line: #e5e7eb;
    --primary: #84c140;
    --primary-deep: #6ba530;
    --accent: #e63946;
    --bg: #f3f9ea;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  html, body {
    font-family: 'Pretendard Variable', Pretendard, system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 32px 16px;
  }
  .card {
    width: 100%; max-width: 400px;
    background: #fff;
    border-radius: 22px;
    padding: 44px 36px 36px;
    box-shadow: 0 1px 0 rgba(13,17,23,0.04), 0 30px 60px -30px rgba(13,17,23,0.25);
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 28px;
    font-weight: 800; font-size: 16px; letter-spacing: -0.5px;
  }
  .brand .logo-mark {
    width: 32px; height: 32px;
    background: var(--primary);
    color: #fff;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 900;
    font-size: 14px;
  }
  h1 {
    font-size: 24px; font-weight: 800;
    letter-spacing: -0.5px;
    line-height: 1.25;
    margin-bottom: 8px;
  }
  .sub {
    color: var(--muted); font-size: 14px; line-height: 1.55;
    margin-bottom: 22px;
  }
  .demo-info {
    background: rgba(37,99,235,0.06);
    border-left: 3px solid var(--primary);
    padding: 12px 14px;
    border-radius: 6px;
    font-size: 12px;
    color: var(--ink);
    margin-bottom: 24px;
    line-height: 1.6;
  }
  .demo-info strong { color: var(--primary-deep); }
  label {
    display: block;
    font-size: 12px; font-weight: 700; color: var(--muted);
    margin: 14px 0 6px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  input {
    width: 100%;
    padding: 13px 14px;
    border: 1.5px solid var(--line);
    border-radius: 12px;
    font-size: 15px;
    font-family: inherit;
    color: var(--ink);
    background: #fff;
    transition: border-color 0.18s ease, box-shadow 0.18s ease;
  }
  input:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 4px rgba(37,99,235,0.15);
  }
  .err {
    margin-top: 14px;
    padding: 10px 12px;
    background: #fef2f2;
    border: 1px solid #fca5a5;
    color: #b91c1c;
    border-radius: 8px;
    font-size: 13px;
    display: none;
  }
  .err.show { display: block; }
  button.primary {
    width: 100%;
    margin-top: 22px;
    padding: 14px;
    background: var(--ink);
    color: #fff;
    border: 0;
    border-radius: 12px;
    font-weight: 700;
    font-size: 15px;
    font-family: inherit;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  button.primary:hover { opacity: 0.92; }
  button.primary:disabled { opacity: 0.55; cursor: wait; }
  .foot {
    margin-top: 26px;
    padding-top: 22px;
    border-top: 1px solid var(--line);
    font-size: 11px;
    color: var(--muted);
    text-align: center;
    line-height: 1.6;
  }
</style>
</head>
<body>

<div class="card">
  <div class="brand">
    <div class="logo-mark">C</div>
    <span>코지워커 SHOP · 시안</span>
  </div>
  <h1>로그인이 필요합니다</h1>
  <p class="sub">제안용 미리보기 페이지입니다. 발급받은 ID/비밀번호로 로그인해주세요.</p>

  <div class="demo-info">
    <strong>📋 제안용 데모 사이트</strong><br>
    ㈜코지케어 클라이언트 미팅용 프론트 시안입니다.
  </div>

  <form id="loginForm">
    <label for="username">아이디</label>
    <input id="username" name="username" type="text" autocomplete="username" required>

    <label for="password">비밀번호</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>

    <div class="err" id="err">아이디 또는 비밀번호가 올바르지 않습니다.</div>

    <button type="submit" class="primary" id="submitBtn">로그인</button>
  </form>

  <div class="foot">
    © 2026 MaxImpact · 코지워커 SHOP 시안<br>
    Proposed by MaxImpact for 주식회사 코지케어
  </div>
</div>

<script>
  const form = document.getElementById('loginForm');
  const err = document.getElementById('err');
  const btn = document.getElementById('submitBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.classList.remove('show');
    btn.disabled = true;
    btn.textContent = '확인 중...';

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    try {
      const res = await fetch('/cozycare/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });
      if (res.ok) {
        location.href = '/cozycare/';
      } else {
        err.classList.add('show');
        btn.disabled = false;
        btn.textContent = '로그인';
      }
    } catch (e) {
      err.textContent = '서버 오류가 발생했습니다.';
      err.classList.add('show');
      btn.disabled = false;
      btn.textContent = '로그인';
    }
  });
</script>

</body>
</html>
