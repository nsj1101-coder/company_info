<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MaxImpact · Admin</title>
<style>
  :root {
    --bg:#f6f7f9; --card:#fff; --ink:#0a0a0a; --ink-2:#3a3a3a; --ink-3:#6a6a6a;
    --line:#e6e7ea; --accent:#0a0a0a; --danger:#dc2626; --pink:#ec4899;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  [hidden] { display:none !important; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,'Pretendard','Helvetica Neue',Arial,sans-serif;
    background:var(--bg); color:var(--ink); min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }

  /* Login */
  .login {
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .login-card {
    background:var(--card); padding:36px 32px; border-radius:18px;
    box-shadow:0 12px 40px rgba(0,0,0,.08); width:100%; max-width:380px;
  }
  .login-card h2 { font-size:20px; margin-bottom:6px; }
  .login-card p { color:var(--ink-3); font-size:13px; margin-bottom:24px; }
  .login-card label { display:block; font-size:12px; color:var(--ink-2); margin-bottom:8px; font-weight:600; }
  .login-card input {
    width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:10px;
    font-size:14px; outline:none; transition:border .2s;
  }
  .login-card input:focus { border-color:var(--ink); }
  .login-card button {
    width:100%; margin-top:18px; padding:12px 14px; background:var(--ink); color:#fff;
    border:none; border-radius:10px; font-size:14px; font-weight:600; cursor:pointer;
    transition:opacity .2s;
  }
  .login-card button:hover { opacity:.88; }
  .login-card .err { color:var(--danger); font-size:13px; margin-top:12px; min-height:18px; }

  /* Dashboard layout */
  .dash { display:flex; flex-direction:column; min-height:100vh; }
  .topbar {
    background:#fff; border-bottom:1px solid var(--line);
    padding:14px 24px; display:flex; align-items:center; gap:18px;
  }
  .brand {
    display:flex; align-items:center; gap:8px; font-weight:800; font-size:16px;
  }
  .brand .dot { width:8px; height:8px; border-radius:50%; background:var(--ink); }
  .tabs { display:flex; gap:4px; margin-left:24px; background:#f0f1f3; padding:4px; border-radius:10px; }
  .tab {
    background:none; border:none; padding:8px 18px; border-radius:8px;
    font-size:13px; font-weight:600; cursor:pointer; color:var(--ink-2);
    transition:all .15s;
  }
  .tab:hover { color:var(--ink); }
  .tab.active { background:#fff; color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .top-spacer { flex:1; }
  .top-meta { color:var(--ink-3); font-size:12px; }
  .logout-btn {
    background:none; border:1px solid var(--line); padding:7px 14px;
    border-radius:8px; cursor:pointer; font-size:13px; color:var(--ink-3);
  }
  .logout-btn:hover { color:var(--ink); }

  /* Tab content */
  .tab-content { flex:1; display:flex; flex-direction:column; }
  .tab-content[hidden] { display:none; }

  /* Inquiries tab */
  .inquiry-wrap { padding:24px 28px 80px; max-width:1480px; margin:0 auto; width:100%; }
  .stats {
    display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px; margin-bottom:20px;
  }
  .stat {
    background:var(--card); border-radius:14px; padding:18px 20px; border:1px solid var(--line);
  }
  .stat .label { font-size:11px; text-transform:uppercase; color:var(--ink-3); letter-spacing:1px; font-weight:600; }
  .stat .value { font-size:28px; font-weight:800; margin-top:6px; letter-spacing:-1px; }

  .toolbar { display:flex; gap:10px; align-items:center; margin-bottom:14px; flex-wrap:wrap; }
  .toolbar input {
    flex:1; min-width:200px; padding:10px 14px; border:1px solid var(--line);
    border-radius:10px; font-size:14px; background:var(--card); outline:none;
  }
  .toolbar input:focus { border-color:var(--ink); }
  .toolbar button.refresh {
    padding:10px 18px; background:var(--ink); color:#fff; border:1px solid var(--ink);
    border-radius:10px; font-size:13px; cursor:pointer; font-weight:600;
  }

  .table-card { background:var(--card); border-radius:14px; border:1px solid var(--line); overflow:hidden; }
  table { width:100%; border-collapse:collapse; }
  th, td {
    text-align:left; padding:14px 16px; font-size:13px; vertical-align:top;
    border-bottom:1px solid var(--line);
  }
  th {
    font-size:11px; text-transform:uppercase; color:var(--ink-3); letter-spacing:1px;
    background:#fafbfc; font-weight:700;
  }
  tr:last-child td { border-bottom:none; }
  tr:hover td { background:#fafbfc; }
  td.desc { max-width:380px; white-space:pre-wrap; word-break:break-word; color:var(--ink-2); }
  td.name { font-weight:700; }
  td.created { color:var(--ink-3); font-size:12px; white-space:nowrap; }
  td.actions { white-space:nowrap; }
  .badge {
    display:inline-block; padding:3px 10px; border-radius:99px; background:#eef0f3;
    font-size:11px; font-weight:600; color:var(--ink-2);
  }
  .del-btn {
    background:none; border:1px solid var(--line); color:var(--ink-3);
    padding:6px 10px; border-radius:8px; font-size:12px; cursor:pointer;
    transition:all .15s;
  }
  .del-btn:hover { color:var(--danger); border-color:var(--danger); }
  .empty { padding:60px 20px; text-align:center; color:var(--ink-3); font-size:14px; }

  /* Baekae tab */
  .baekae-wrap { flex:1; display:flex; flex-direction:column; background:#fff; }
  .baekae-wrap iframe { flex:1; width:100%; border:0; min-height:calc(100vh - 64px); display:block; }
  .baekae-open {
    padding:8px 16px; background:var(--card); border:1px solid var(--line);
    border-radius:8px; cursor:pointer; font-size:12px; color:var(--ink-2);
    text-decoration:none; display:inline-flex; align-items:center; gap:6px;
  }
  .baekae-open:hover { color:var(--ink); }

  @media (max-width:780px) {
    .topbar { padding:10px 16px; flex-wrap:wrap; }
    .tabs { margin-left:0; order:3; width:100%; }
    .inquiry-wrap { padding:16px 14px 60px; }
    th, td { padding:10px 12px; font-size:12px; }
    td.desc { max-width:160px; }
  }
</style>
</head>
<body>

<!-- Login View -->
<div id="loginView" class="login">
  <div class="login-card">
    <h2>MaxImpact Admin</h2>
    <p>견적 요청 · 백애 관리</p>
    <form id="loginForm">
      <label for="pw">비밀번호</label>
      <input id="pw" type="password" autocomplete="current-password" required>
      <button type="submit">로그인</button>
      <div class="err" id="loginErr"></div>
    </form>
  </div>
</div>

<!-- Dashboard View -->
<div id="dashView" class="dash" hidden>
  <div class="topbar">
    <div class="brand"><span class="dot"></span>MaxImpact Admin</div>
    <div class="tabs">
      <button class="tab active" data-tab="inquiries">📝 견적 문의</button>
      <button class="tab" data-tab="baekae">💝 백애 어드민</button>
    </div>
    <div class="top-spacer"></div>
    <span class="top-meta" id="topMeta"></span>
    <button class="logout-btn" id="logoutBtn">로그아웃</button>
  </div>

  <!-- Inquiries Tab -->
  <div class="tab-content" id="tabInquiries">
    <div class="inquiry-wrap">
      <div class="stats">
        <div class="stat"><div class="label">전체 요청</div><div class="value" id="statTotal">0</div></div>
        <div class="stat"><div class="label">오늘</div><div class="value" id="statToday">0</div></div>
        <div class="stat"><div class="label">최근 7일</div><div class="value" id="stat7d">0</div></div>
      </div>

      <div class="toolbar">
        <input id="search" type="text" placeholder="이름·이메일·연락처·내용 검색">
        <button class="refresh" id="refreshBtn">새로고침</button>
      </div>

      <div class="table-card">
        <table>
          <thead>
            <tr>
              <th>#</th><th>이름/회사</th><th>연락처</th><th>이메일</th>
              <th>유형</th><th>설명</th><th>접수일</th><th></th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
        <div id="empty" class="empty" hidden>아직 접수된 요청이 없습니다.</div>
      </div>
    </div>
  </div>

  <!-- Baekae Tab -->
  <div class="tab-content" id="tabBaekae" hidden>
    <div class="baekae-wrap">
      <iframe id="baekaeFrame" title="백애 어드민" loading="lazy"></iframe>
    </div>
  </div>
</div>

<script>
  const STORAGE_KEY = 'mi_admin_pw';
  const BAEKAE_BASE = '/baekae/admin';
  let allRows = [];

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');

  function show(view) {
    $('loginView').hidden = view !== 'login';
    $('dashView').hidden = view !== 'dash';
  }

  function switchTab(name) {
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
    $('tabInquiries').hidden = name !== 'inquiries';
    $('tabBaekae').hidden = name !== 'baekae';
    if (name === 'baekae') {
      const f = $('baekaeFrame');
      if (!f.src) f.src = BAEKAE_BASE;
    }
  }

  async function fetchSubmissions(pw) {
    const res = await fetch('/api/submissions', { headers: { 'x-admin-password': pw } });
    if (res.status === 401) throw new Error('UNAUTHORIZED');
    if (!res.ok) throw new Error('SERVER');
    return res.json();
  }

  function formatDate(iso) {
    if (!iso) return '';
    const t = String(iso).replace(' ', 'T');
    const d = new Date(t + (t.endsWith('Z') ? '' : 'Z'));
    if (isNaN(d.getTime())) return iso;
    const pad = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  function render(rows) {
    const q = $('search').value.trim().toLowerCase();
    const filtered = !q ? rows : rows.filter(r =>
      [r.name, r.phone, r.email, r.project_type, r.description].some(v =>
        String(v ?? '').toLowerCase().includes(q)
      )
    );

    $('tbody').innerHTML = filtered.map(r => `
      <tr data-id="${r.id}">
        <td>${r.id}</td>
        <td class="name">${esc(r.name)}</td>
        <td>${esc(r.phone)}</td>
        <td><a href="mailto:${esc(r.email)}">${esc(r.email)}</a></td>
        <td><span class="badge">${esc(r.project_type)}</span></td>
        <td class="desc">${esc(r.description)}</td>
        <td class="created">${esc(formatDate(r.created_at))}</td>
        <td class="actions"><button class="del-btn" data-del="${r.id}">삭제</button></td>
      </tr>
    `).join('');
    $('empty').hidden = filtered.length > 0;

    const now = new Date();
    const todayStr = now.toISOString().slice(0, 10);
    const weekAgo = new Date(now.getTime() - 7 * 24 * 3600 * 1000);
    let today = 0, week = 0;
    for (const r of rows) {
      const t = String(r.created_at || '').slice(0, 10);
      if (t === todayStr) today++;
      const d = new Date(String(r.created_at || '').replace(' ', 'T'));
      if (!isNaN(d) && d >= weekAgo) week++;
    }
    $('statTotal').textContent = rows.length;
    $('statToday').textContent = today;
    $('stat7d').textContent = week;
    $('topMeta').textContent = `업데이트 ${formatDate(new Date().toISOString().slice(0, 19))}`;
  }

  async function loadAll() {
    const pw = sessionStorage.getItem(STORAGE_KEY);
    if (!pw) return show('login');
    try {
      const data = await fetchSubmissions(pw);
      allRows = data.submissions || [];
      render(allRows);
      show('dash');
    } catch (err) {
      if (err.message === 'UNAUTHORIZED') {
        sessionStorage.removeItem(STORAGE_KEY);
        show('login');
        $('loginErr').textContent = '비밀번호가 만료되었거나 잘못되었습니다.';
      } else {
        alert('서버 오류가 발생했습니다.');
      }
    }
  }

  $('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    $('loginErr').textContent = '';
    const pw = $('pw').value;
    try {
      const data = await fetchSubmissions(pw);
      sessionStorage.setItem(STORAGE_KEY, pw);
      allRows = data.submissions || [];
      render(allRows);
      show('dash');
    } catch (err) {
      $('loginErr').textContent = err.message === 'UNAUTHORIZED'
        ? '비밀번호가 올바르지 않습니다.'
        : '서버 오류가 발생했습니다.';
    }
  });

  $('logoutBtn').addEventListener('click', () => {
    sessionStorage.removeItem(STORAGE_KEY);
    $('baekaeFrame').src = 'about:blank';
    show('login');
    $('pw').value = '';
  });

  $('refreshBtn').addEventListener('click', loadAll);
  $('search').addEventListener('input', () => render(allRows));

  document.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', () => switchTab(btn.dataset.tab));
  });

  $('tbody').addEventListener('click', async (e) => {
    const btn = e.target.closest('[data-del]');
    if (!btn) return;
    const id = btn.dataset.del;
    if (!confirm(`#${id} 항목을 삭제하시겠습니까?`)) return;
    const pw = sessionStorage.getItem(STORAGE_KEY);
    const res = await fetch(`/api/submissions/${id}`, {
      method: 'DELETE',
      headers: { 'x-admin-password': pw },
    });
    if (res.ok) {
      allRows = allRows.filter(r => String(r.id) !== String(id));
      render(allRows);
    } else {
      alert('삭제에 실패했습니다.');
    }
  });

  loadAll();
</script>

</body>
</html>
