<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://maximpact.co.kr/">
  <meta name="theme-color" content="#ff5722">
  <link rel="icon" href="/favicon.ico">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="MaxImpact">
  <meta property="og:title" content="404 — 페이지를 찾을 수 없습니다 | MaxImpact">
  <meta property="og:description" content="요청하신 페이지를 찾을 수 없습니다. MaxImpact 홈으로 이동하세요.">
  <meta property="og:url" content="https://maximpact.co.kr/404">
  <meta property="og:locale" content="ko_KR">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --bg-soft: #fafafa;
      --ink: #0a0a0a;
      --ink-2: #262626;
      --ink-3: #525252;
      --ink-4: #737373;
      --ink-5: #a3a3a3;
      --line: #e7e5e4;
      --accent: #ff5722;
      --accent-2: #ff8a4c;
      --ease: cubic-bezier(0.16,1,0.3,1);
    }
    *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
    html, body { height:100%; }
    body {
      font-family:'Inter','Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
      background:
        radial-gradient(800px 500px at 20% 20%, rgba(255,87,34,0.08), transparent 60%),
        radial-gradient(700px 500px at 80% 80%, rgba(255,138,76,0.06), transparent 60%),
        var(--bg);
      color:var(--ink);
      line-height:1.6;
      word-break:keep-all;
      -webkit-font-smoothing:antialiased;
      display:flex;
      flex-direction:column;
      min-height:100vh;
      overflow-x:hidden;
    }
    a { color:inherit; text-decoration:none; }

    /* Top brand */
    .topbar {
      padding:28px 40px;
      display:flex; align-items:center;
    }
    .brand {
      font-family:'Manrope','Inter',sans-serif;
      font-size:20px; font-weight:800; letter-spacing:-0.6px; color:var(--ink);
      display:inline-flex; align-items:center; gap:10px;
    }
    .brand-dot {
      width:10px; height:10px; border-radius:50%;
      background:var(--accent);
      box-shadow:0 0 0 4px rgba(255,87,34,0.15);
    }

    /* Main */
    main {
      flex:1;
      display:flex; align-items:center; justify-content:center;
      padding:40px 32px 80px;
    }
    .inner {
      max-width:760px; text-align:center;
      animation:fadeUp .8s var(--ease);
    }
    @keyframes fadeUp {
      from { opacity:0; transform:translateY(20px); }
      to   { opacity:1; transform:translateY(0); }
    }
    .eyebrow {
      display:inline-flex; align-items:center; gap:8px;
      padding:6px 14px; border-radius:100px;
      background:rgba(255,87,34,0.08);
      border:1px solid rgba(255,87,34,0.25);
      color:var(--accent);
      font-family:'Manrope',sans-serif;
      font-size:11.5px; font-weight:700; letter-spacing:1.5px;
      text-transform:uppercase;
      margin-bottom:24px;
    }
    .eyebrow .pulse {
      width:6px; height:6px; border-radius:50%; background:var(--accent);
      animation:pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform:scale(1); opacity:1; }
      50%      { transform:scale(1.4); opacity:0.55; }
    }
    .big {
      font-family:'Manrope','Inter',sans-serif;
      font-weight:800;
      font-size:clamp(96px, 22vw, 220px);
      line-height:0.95;
      letter-spacing:-6px;
      background:linear-gradient(135deg, var(--ink) 0%, var(--accent) 60%, var(--accent-2) 100%);
      -webkit-background-clip:text;
      background-clip:text;
      -webkit-text-fill-color:transparent;
      margin-bottom:24px;
    }
    h1 {
      font-family:'Inter','Pretendard',sans-serif;
      font-size:clamp(26px, 4vw, 38px);
      font-weight:700;
      letter-spacing:-1px;
      color:var(--ink);
      margin-bottom:14px;
    }
    h1 .italic { font-style:italic; font-weight:400; color:var(--ink-4); }
    p.lead {
      font-size:16px; color:var(--ink-3); line-height:1.7;
      max-width:520px; margin:0 auto 36px;
    }
    .actions {
      display:flex; gap:12px; justify-content:center; flex-wrap:wrap;
    }
    .btn {
      display:inline-flex; align-items:center; gap:8px;
      padding:14px 24px; border-radius:100px;
      font-size:14.5px; font-weight:600;
      transition:transform .2s var(--ease), background .25s, color .25s, border-color .25s;
      border:1px solid transparent;
    }
    .btn-dark {
      background:var(--ink); color:#fff;
    }
    .btn-dark:hover { background:var(--accent); transform:translateY(-2px); }
    .btn-light {
      background:transparent; color:var(--ink-2);
      border-color:var(--line);
    }
    .btn-light:hover { border-color:var(--ink); color:var(--ink); transform:translateY(-2px); }
    .btn svg { transition:transform .2s; }
    .btn:hover svg { transform:translateX(3px); }

    /* Suggested links */
    .suggest {
      margin-top:64px;
      padding-top:32px;
      border-top:1px solid var(--line);
    }
    .suggest h2 {
      font-family:'Manrope',sans-serif;
      font-size:12px; font-weight:700; letter-spacing:1.5px;
      text-transform:uppercase; color:var(--ink-4);
      margin-bottom:18px;
    }
    .suggest-grid {
      display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr));
      gap:10px;
    }
    .suggest-grid a {
      display:flex; justify-content:space-between; align-items:center;
      padding:14px 18px; border:1px solid var(--line); border-radius:14px;
      font-size:14px; color:var(--ink-2); font-weight:500;
      background:#fff;
      transition:border-color .2s, transform .2s, background .25s;
    }
    .suggest-grid a:hover {
      border-color:var(--ink); transform:translateY(-2px);
      background:var(--bg-soft);
    }
    .suggest-grid a span.arrow { color:var(--ink-5); }
    .suggest-grid a:hover span.arrow { color:var(--accent); }

    /* Footer */
    footer {
      padding:24px 40px;
      border-top:1px solid var(--line);
      font-size:12px; color:var(--ink-5);
      font-family:'Manrope',sans-serif; font-weight:500;
      display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;
    }
    @media (max-width: 640px) {
      .topbar { padding:20px 24px; }
      main { padding:20px 20px 60px; }
      footer { padding:20px 24px; flex-direction:column; align-items:flex-start; }
    }
  </style>
</head>
<body>

  <div class="topbar">
    <a href="/" class="brand" aria-label="MaxImpact 홈으로 이동">
      <span class="brand-dot"></span>
      MaxImpact
    </a>
  </div>

  <main>
    <div class="inner">
      <div class="eyebrow">
        <span class="pulse"></span>
        ERROR 404 · PAGE NOT FOUND
      </div>
      <div class="big" aria-hidden="true">404</div>
      <h1>요청하신 페이지를 <span class="italic">찾을 수 없습니다.</span></h1>
      <p class="lead">
        주소가 잘못 입력되었거나, 페이지가 삭제·이동되었을 수 있습니다.<br>
        홈으로 돌아가 MaxImpact의 서비스를 확인해보세요.
      </p>

      <div class="actions">
        <a href="/" class="btn btn-dark" aria-label="홈으로 가기">
          홈으로 가기
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
        <a href="/#contact" class="btn btn-light" aria-label="프로젝트 문의하기">
          프로젝트 문의
        </a>
      </div>

      <div class="suggest">
        <h2>이런 페이지는 어떠세요?</h2>
        <div class="suggest-grid">
          <a href="/#services"><span>서비스 소개</span><span class="arrow">→</span></a>
          <a href="/#portfolio"><span>포트폴리오</span><span class="arrow">→</span></a>
          <a href="/#team"><span>팀 소개</span><span class="arrow">→</span></a>
          <a href="/#contact"><span>견적 문의</span><span class="arrow">→</span></a>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <div>© 2026 MaxImpact. All rights reserved.</div>
    <div>AI · Web Development Team · Seoul, KR</div>
  </footer>

</body>
</html>
