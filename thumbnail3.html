<html lang="en" vid="0"><head vid="1">
    <meta charset="UTF-8" vid="2">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" vid="3">
    <title vid="4">Student Portfolio - Desktop Environment</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" vid="5">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" vid="6">
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet" vid="7">
    
    

    <style vid="8">
        :root {
            --xp-blue: #0054E3;
            --xp-blue-light: #3a93ff;
            --xp-blue-dark: #002D8B;
            --xp-green: #3c8d3c;
            --xp-taskbar: linear-gradient(to bottom, #245edb 0%, #3f8cf3 9%, #245edb 18%, #245edb 92%, #333 100%);
            --window-bg: #ece9d8;
            --content-bg: #ffffff;
            --content-text: #111111;
            
            --os-font: Tahoma, "Trebuchet MS", sans-serif;
            --content-font: 'Geist', sans-serif;
            --mono-font: 'IBM Plex Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            overflow: hidden;
            font-family: var(--os-font);
            background-color: #000;
            width: 100vw;
            height: 100vh;
        }

        
        .desktop {
            width: 100%;
            height: calc(100vh - 30px);
            background-image: url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?q=80&w=2832&auto=format&fit=crop');
            background-size: cover;
            background-position: center bottom;
            position: relative;
            display: grid;
            grid-template-columns: repeat(auto-fill, 75px);
            grid-template-rows: repeat(auto-fill, 75px);
            grid-auto-flow: column;
            padding: 10px;
            gap: 5px;
        }

        
        .icon-container {
            width: 75px;
            height: 75px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 2px;
            cursor: pointer;
            border: 1px solid transparent;
        }

        .icon-container:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .icon-container.selected {
            background-color: rgba(0, 0, 128, 0.4);
            border: 1px dotted rgba(255, 255, 255, 0.6);
        }

        .icon-graphic {
            width: 32px;
            height: 32px;
            margin-bottom: 4px;
            position: relative;
            background-color: #eee; 
            box-shadow: inset -1px -1px #000, inset 1px 1px #fff;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-graphic svg {
            width: 24px;
            height: 24px;
            fill: #333;
        }

        
        .shortcut-arrow {
            position: absolute;
            bottom: -2px;
            left: -2px;
            width: 12px;
            height: 12px;
            background-color: white;
            border: 1px solid #aaa;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .shortcut-arrow::after {
            content: '➚';
            font-size: 10px;
            color: var(--xp-blue);
            font-weight: bold;
            line-height: 1;
            margin-top: -2px;
            margin-left: -1px;
        }

        .icon-label {
            color: white;
            font-size: 11px;
            text-align: center;
            line-height: 1.2;
            word-wrap: break-word;
            width: 100%;
            
            text-shadow: 
                -1px -1px 0 #000,  
                 1px -1px 0 #000,
                -1px  1px 0 #000,
                 1px  1px 0 #000,
                 2px  2px 2px rgba(0,0,0,0.8);
        }

        .icon-container.selected .icon-label {
            background-color: var(--xp-blue);
            text-shadow: none;
            padding: 0 2px;
        }

        
        .taskbar {
            height: 30px;
            width: 100%;
            background: var(--xp-taskbar);
            position: absolute;
            bottom: 0;
            left: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
        }

        .start-btn {
            height: 100%;
            background: linear-gradient(to bottom, #4ba54b 0%, #3c8d3c 100%);
            border: none;
            border-right: 1px solid #1a5c1a;
            border-radius: 0 10px 10px 0;
            padding: 0 15px 0 10px;
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            box-shadow: inset 1px 1px rgba(255,255,255,0.4), inset -1px -1px rgba(0,0,0,0.3);
        }

        .start-btn:active {
            box-shadow: inset 2px 2px rgba(0,0,0,0.4);
        }

        .windows-logo {
            width: 16px;
            height: 16px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 1px;
            transform: skewY(-10deg);
        }
        .win-red { background: #f04e23; }
        .win-green { background: #79c539; }
        .win-blue { background: #00a4ef; }
        .win-yellow { background: #fdbb00; }

        .start-text {
            color: white;
            font-weight: bold;
            font-style: italic;
            font-size: 14px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.6);
        }

        .system-tray {
            height: 100%;
            background: linear-gradient(to bottom, #108ae5 0%, #0e72bd 100%);
            border-left: 1px solid rgba(255,255,255,0.2);
            padding: 0 15px;
            display: flex;
            align-items: center;
            color: white;
            font-size: 11px;
            box-shadow: inset 1px 0 rgba(0,0,0,0.2);
        }

        
        .start-menu {
            position: absolute;
            bottom: 30px;
            left: 0;
            width: 300px;
            background: #fff;
            border: 1px solid var(--xp-blue);
            border-radius: 5px 5px 0 0;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.5);
            display: none;
            flex-direction: column;
            z-index: 1001;
            overflow: hidden;
        }

        .start-menu.active {
            display: flex;
        }

        .start-menu-header {
            background: linear-gradient(to right, var(--xp-blue-dark), var(--xp-blue));
            color: white;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid #ffaa00; 
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            background: #fff;
            border: 2px solid rgba(255,255,255,0.5);
            border-radius: 3px;
            overflow: hidden;
        }
        .user-avatar img { width: 100%; height: 100%; object-fit: cover; }

        .user-name {
            font-size: 14px;
            font-weight: bold;
            text-shadow: 1px 1px 1px rgba(0,0,0,0.5);
        }

        .start-menu-body {
            display: flex;
            background: #fff;
        }

        .start-menu-left {
            flex: 1;
            padding: 5px;
            background: #fff;
        }

        .menu-item {
            padding: 8px 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-size: 11px;
            color: #333;
        }

        .menu-item:hover {
            background-color: var(--xp-blue);
            color: white;
        }

        .menu-icon {
            width: 24px;
            height: 24px;
            background: #eee;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .start-menu-right {
            width: 120px;
            background: #d3e5fa;
            border-left: 1px solid #99c8fc;
            padding: 5px;
        }

        
        .window {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 800px;
            height: 600px;
            background: var(--window-bg);
            border: 1px solid #00138c;
            border-radius: 8px 8px 0 0;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5), inset 0 0 0 1px #0831d9;
            display: none;
            flex-direction: column;
            z-index: 100;
            resize: both;
            overflow: hidden;
        }

        .window.active {
            display: flex;
        }

        .title-bar {
            background: linear-gradient(to bottom, #0058e6 0%, #3a93ff 8%, #288eff 40%, #127dff 88%, #036bfe 100%);
            padding: 4px;
            border-radius: 7px 7px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: move;
        }

        .title-bar-text {
            color: white;
            font-weight: bold;
            font-size: 12px;
            text-shadow: 1px 1px #00138c;
            display: flex;
            align-items: center;
            gap: 5px;
            margin-left: 2px;
        }

        .title-bar-controls {
            display: flex;
            gap: 2px;
        }

        .ctrl-btn {
            width: 21px;
            height: 21px;
            border: 1px solid #fff;
            border-radius: 3px;
            background: linear-gradient(to bottom, #fff 0%, #ece9d8 100%);
            box-shadow: inset -1px -1px 2px rgba(0,0,0,0.2), 0 1px 1px rgba(0,0,0,0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-weight: bold;
            font-family: Arial, sans-serif;
            color: #fff;
            font-size: 10px;
        }

        .ctrl-close {
            background: linear-gradient(to bottom, #e98b7e 0%, #d84534 50%, #c42713 51%, #e03b26 100%);
            border-color: #fff;
        }
        
        .ctrl-close:active {
            background: #b01c0a;
            box-shadow: inset 2px 2px 4px rgba(0,0,0,0.5);
        }

        
        .menu-bar {
            background: var(--window-bg);
            padding: 2px 0;
            border-bottom: 1px solid #fff;
            display: flex;
            font-size: 11px;
        }
        .menu-bar-item {
            padding: 4px 8px;
            cursor: pointer;
        }
        .menu-bar-item:hover {
            background: #316ac5;
            color: white;
        }

        
        
        .window-content {
            flex: 1;
            background: var(--content-bg);
            border: 2px solid #fff;
            border-right-color: #aca899;
            border-bottom-color: #aca899;
            margin: 2px;
            overflow-y: auto;
            user-select: text; 
            
            
            font-family: var(--content-font);
            color: var(--content-text);
            padding: 40px 60px;
        }

        .content-header {
            margin-bottom: 40px;
            border-bottom: 1px solid #eee;
            padding-bottom: 20px;
        }

        .project-meta {
            font-family: var(--mono-font);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #666;
            margin-bottom: 10px;
            display: flex;
            gap: 20px;
        }

        .project-title {
            font-size: 3rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            line-height: 1.1;
            margin-bottom: 15px;
        }

        .project-desc {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #444;
            max-width: 600px;
        }

        .project-gallery {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 30px;
        }

        .gallery-item {
            background: #f5f5f5;
            aspect-ratio: 4/3;
            width: 100%;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .gallery-item.full-width {
            grid-column: 1 / -1;
            aspect-ratio: 16/9;
        }

        
        .window-content::-webkit-scrollbar {
            width: 16px;
            background: #e3e3e3;
            border-left: 1px solid #f0f0f0;
        }
        .window-content::-webkit-scrollbar-thumb {
            background: #c2c2c2;
            border: 1px solid #f0f0f0;
            border-right-color: #888;
            border-bottom-color: #888;
        }
        .window-content::-webkit-scrollbar-button {
            display: block;
            height: 16px;
            background-color: #e3e3e3;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 10 10"><path fill="%23000" d="M1 8L5 2l4 6z"/></svg>');
            background-repeat: no-repeat;
            background-position: center;
            border: 1px outset #eee;
        }
        .window-content::-webkit-scrollbar-button:vertical:increment {
             background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 10 10"><path fill="%23000" d="M1 2l4 6 4-6z"/></svg>');
        }

    </style>
</head>
<body vid="9">

    <div class="desktop" id="desktop" vid="10">
        
    </div>

    <div class="taskbar" vid="11">
        <button class="start-btn" id="startBtn" vid="12">
            <div class="windows-logo" vid="13">
                <div class="win-red" vid="14"></div>
                <div class="win-green" vid="15"></div>
                <div class="win-blue" vid="16"></div>
                <div class="win-yellow" vid="17"></div>
            </div>
            <span class="start-text" vid="18">start</span>
        </button>
        <div class="system-tray" id="clock" vid="19">12:00 PM</div>
    </div>

    
    <div class="start-menu" id="startMenu" vid="20">
        <div class="start-menu-header" vid="21">
            <div class="user-avatar" vid="22">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&amp;w=100&amp;auto=format&amp;fit=crop" alt="User" vid="23">
            </div>
            <div class="user-name" vid="24">Student Designer</div>
        </div>
        <div class="start-menu-body" vid="25">
            <div class="start-menu-left" vid="26">
                <div class="menu-item" onclick="openWindow('about')" vid="27">
                    <div class="menu-icon" vid="28">i</div>
                    <span vid="29">About Me</span>
                </div>
                <div class="menu-item" onclick="openWindow('resume')" vid="30">
                    <div class="menu-icon" vid="31">📄</div>
                    <span vid="32">Resume.pdf</span>
                </div>
                <hr style="margin: 5px 0; border: 0; border-top: 1px solid #ddd;" vid="33">
                <div class="menu-item" onclick="alert('Shutting down... just kidding.')" vid="34">
                    <div class="menu-icon" style="background:#e03b26; color:white;" vid="35">⏻</div>
                    <span vid="36">Turn Off Computer</span>
                </div>
            </div>
            <div class="start-menu-right" vid="37">
                
            </div>
        </div>
    </div>

    
    <div class="window" id="appWindow" vid="38">
        <div class="title-bar" id="windowTitleBar" vid="39">
            <div class="title-bar-text" vid="40">
                <img id="winIcon" src="data:image/gif;base64,R0lGODlhAQABAIAAAP///wAAACH5BAEAAAAALAAAAAABAAEAAAICRAEAOw==" width="16" height="16" style="background:#fff; border:1px solid #333;" alt="icon" vid="41">
                <span id="winTitle" vid="42">C:\Projects</span>
            </div>
            <div class="title-bar-controls" vid="43">
                <div class="ctrl-btn" style="line-height: 8px;" vid="44">_</div>
                <div class="ctrl-btn" style="font-size: 14px; line-height: 10px;" vid="45">□</div>
                <div class="ctrl-btn ctrl-close" onclick="closeWindow()" vid="46">x</div>
            </div>
        </div>
        <div class="menu-bar" vid="47">
            <div class="menu-bar-item" vid="48">File</div>
            <div class="menu-bar-item" vid="49">Edit</div>
            <div class="menu-bar-item" vid="50">View</div>
            <div class="menu-bar-item" vid="51">Help</div>
        </div>
        <div class="window-content" id="winContent" vid="52">
            
        </div>
    </div>

    <script vid="53">
        
        const projects = [
            {
                id: 'aware',
                title: 'Aware',
                label: 'Aware_Tactile.exe',
                type: 'Product Design',
                year: '2023',
                iconColor: '#f0e6d2',
                iconSvg: '<rect x="4" y="4" width="4" height="4"/><rect x="12" y="4" width="4" height="4"/><rect x="4" y="12" width="4" height="4"/><rect x="12" y="12" width="4" height="4"/><rect x="4" y="20" width="4" height="4"/>', 
                desc: 'A tactile sticker system designed for visually impaired individuals to easily identify and organize their skincare routines. The system uses a standardized textural vocabulary that translates complex ingredient lists into intuitive touch patterns.',
                images: [
                    'https://images.unsplash.com/photo-1629198688000-71f23e745b6e?q=80&w=800&auto=format&fit=crop', 
                    'https://images.unsplash.com/photo-1607505320853-90d571f54460?q=80&w=800&auto=format&fit=crop'  
                ]
            },
            {
                id: 'catcafe',
                title: 'Spin & Purr',
                label: 'CatCafe_Brand.pdf',
                type: 'Branding',
                year: '2024',
                iconColor: '#333',
                iconSvg: '<circle cx="12" cy="12" r="10" fill="none" stroke="#fff" stroke-width="2"/><circle cx="12" cy="12" r="2" fill="#fff"/><path d="M4 6 L8 2 L12 6 Z" fill="#fff" transform="rotate(-30 8 4)"/><path d="M20 6 L16 2 L12 6 Z" fill="#fff" transform="rotate(30 16 4)"/>', 
                desc: 'Brand identity for a hybrid cat cafe and independent record store. The visual language merges the grooved geometry of vinyl records with subtle, playful feline motifs, utilizing a bold monochromatic palette to avoid cafe clichés.',
                images: [
                    'https://images.unsplash.com/photo-1514525253161-7a46d19cd819?q=80&w=800&auto=format&fit=crop', 
                    'https://images.unsplash.com/photo-1513360371669-4adf3dd7dff8?q=80&w=800&auto=format&fit=crop'  
                ]
            },
            {
                id: 'monkey',
                title: 'Primate Apparel',
                label: 'Merch_Line.psd',
                type: 'Merch / Illustration',
                year: '2023',
                iconColor: '#ffaa00',
                iconSvg: '<rect x="6" y="6" width="12" height="12" rx="4"/><circle cx="9" cy="10" r="1"/><circle cx="15" cy="10" r="1"/><path d="M9 14 Q12 16 15 14" fill="none" stroke="#333" stroke-width="1.5"/>', 
                desc: 'A limited-run streetwear merchandise line drawing inspiration from behavioral research on macaques. The design utilizes distressed typography and high-contrast screen print techniques to create a gritty, urban aesthetic.',
                images: [
                    'https://images.unsplash.com/photo-1529374255404-311a2a4f1fd9?q=80&w=800&auto=format&fit=crop', 
                    'https://images.unsplash.com/photo-1540569014015-19a7be504e3a?q=80&w=800&auto=format&fit=crop'  
                ]
            },
            {
                id: 'paint',
                title: 'Glide Colors',
                label: 'RollOn_Paint.zip',
                type: 'Group Project / Branding',
                year: '2023',
                iconColor: '#00a4ef',
                iconSvg: '<rect x="8" y="4" width="8" height="10" rx="2"/><rect x="11" y="14" width="2" height="6"/><rect x="6" y="20" width="12" height="2"/>', 
                desc: 'An inclusive art supply design: roll-on paint bottles ergonomically engineered for both young children developing motor skills and elderly users managing arthritis. My role focused on the approachable, high-contrast packaging brand.',
                images: [
                    'https://images.unsplash.com/photo-1513364776144-60967b0f800f?q=80&w=800&auto=format&fit=crop', 
                    'https://images.unsplash.com/photo-1502046467006-21443657755d?q=80&w=800&auto=format&fit=crop'  
                ]
            },
            {
                id: 'zine',
                title: 'Hippocampus',
                label: 'Zine_Exp.indd',
                type: 'Visual Research',
                year: '2024',
                iconColor: '#ff66b2',
                iconSvg: '<path d="M14 4 C18 4 18 8 16 10 C14 12 10 14 10 18 C10 20 12 22 14 22 C12 24 8 22 8 18 C8 12 12 10 14 8 C16 6 14 4 14 4 Z" fill="none" stroke="#333" stroke-width="2"/>', 
                desc: 'An experimental visual zine documenting a rigorous image-making process. The subject—a seahorse—is reproduced across 40 pages using different physical media (wax crayon, graphite, bleach, ink) to study material degradation and form.',
                images: [
                    'https://images.unsplash.com/photo-1603484400977-160ba26f2f9d?q=80&w=800&auto=format&fit=crop', 
                    'https://images.unsplash.com/photo-1564348633785-055a30eddb04?q=80&w=800&auto=format&fit=crop'  
                ]
            },
            {
                id: 'font',
                title: 'Burst Display',
                label: 'Burst_Font.ttf',
                type: 'Typography',
                year: '2024',
                iconColor: '#fff',
                iconSvg: '<text x="12" y="18" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">A</text><circle cx="6" cy="6" r="1" fill="#f00"/><circle cx="18" cy="8" r="1" fill="#00f"/><circle cx="12" cy="2" r="1" fill="#fa0"/>', 
                desc: 'A commercially published display typeface inspired by the ephemeral trajectories of fireworks. The letterforms feature sharp, explosive terminals and varying weights that mimic the expansion of light in the night sky.',
                images: [
                    'https://images.unsplash.com/photo-1498931299472-f7a63a5a1cfa?q=80&w=800&auto=format&fit=crop', 
                    'https://images.unsplash.com/photo-1616423640778-28d1b53229bd?q=80&w=800&auto=format&fit=crop'  
                ]
            }
        ];

        
        const desktop = document.getElementById('desktop');
        const appWindow = document.getElementById('appWindow');
        const winTitle = document.getElementById('winTitle');
        const winContent = document.getElementById('winContent');
        let selectedIcon = null;

        
        projects.forEach(proj => {
            const el = document.createElement('div');
            el.className = 'icon-container';
            el.dataset.id = proj.id;
            
            
            el.innerHTML = `
                <div class="icon-graphic" style="background-color: ${proj.iconColor}">
                    <svg viewBox="0 0 24 24">${proj.iconSvg}</svg>
                    <div class="shortcut-arrow"></div>
                </div>
                <div class="icon-label">${proj.label}</div>
            `;

            
            el.addEventListener('click', (e) => {
                e.stopPropagation();
                if(selectedIcon) selectedIcon.classList.remove('selected');
                el.classList.add('selected');
                selectedIcon = el;
            });

            
            el.addEventListener('dblclick', () => {
                openProject(proj);
            });

            desktop.appendChild(el);
        });

        
        desktop.addEventListener('click', () => {
            if(selectedIcon) selectedIcon.classList.remove('selected');
            selectedIcon = null;
            document.getElementById('startMenu').classList.remove('active');
        });

        
        function openProject(proj) {
            winTitle.innerText = `C:\\Projects\\${proj.label}`;
            
            
            let imagesHtml = '';
            proj.images.forEach((img, index) => {
                const isFull = index === 0 ? 'full-width' : '';
                imagesHtml += `<div class="gallery-item ${isFull}"><img src="${img}" alt="Project imagery"></div>`;
            });

            winContent.innerHTML = `
                <div class="content-header">
                    <div class="project-meta">
                        <span>${proj.type}</span>
                        <span>//</span>
                        <span>${proj.year}</span>
                    </div>
                    <h1 class="project-title">${proj.title}</h1>
                    <p class="project-desc">${proj.desc}</p>
                </div>
                <div class="project-gallery">
                    ${imagesHtml}
                </div>
            `;
            
            appWindow.classList.add('active');
            
            
            const offset = Math.floor(Math.random() * 40) - 20;
            appWindow.style.transform = `translate(calc(-50% + ${offset}px), calc(-50% + ${offset}px))`;
        }

        function openWindow(type) {
             winTitle.innerText = `System Properties`;
             winContent.innerHTML = `
                <div class="content-header">
                    <h1 class="project-title">About the Designer</h1>
                    <p class="project-desc">I am a student designer interested in branding, typography, and design research. I believe in high-contrast concepts: housing meticulous, grid-based graphic design inside chaotic, nostalgic digital environments.</p>
                </div>
             `;
             appWindow.classList.add('active');
             document.getElementById('startMenu').classList.remove('active');
        }

        function closeWindow() {
            appWindow.classList.remove('active');
        }

        
        const startBtn = document.getElementById('startBtn');
        const startMenu = document.getElementById('startMenu');
        
        startBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            startMenu.classList.toggle('active');
        });

        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12; 
            minutes = minutes < 10 ? '0' + minutes : minutes;
            document.getElementById('clock').innerText = hours + ':' + minutes + ' ' + ampm;
        }
        setInterval(updateClock, 1000);
        updateClock();

        
        const titleBar = document.getElementById('windowTitleBar');
        let isDragging = false;
        let currentX;
        let currentY;
        let initialX;
        let initialY;
        let xOffset = 0;
        let yOffset = 0;

        titleBar.addEventListener("mousedown", dragStart);
        document.addEventListener("mouseup", dragEnd);
        document.addEventListener("mousemove", drag);

        function dragStart(e) {
            initialX = e.clientX - xOffset;
            initialY = e.clientY - yOffset;
            if (e.target === titleBar || e.target.parentNode === titleBar) {
                isDragging = true;
            }
        }

        function dragEnd(e) {
            initialX = currentX;
            initialY = currentY;
            isDragging = false;
        }

        function drag(e) {
            if (isDragging) {
                e.preventDefault();
                currentX = e.clientX - initialX;
                currentY = e.clientY - initialY;
                xOffset = currentX;
                yOffset = currentY;
                
                appWindow.style.transform = "translate(-50%, -50%)"; 
                appWindow.style.left = `calc(50% + ${currentX}px)`;
                appWindow.style.top = `calc(50% + ${currentY}px)`;
            }
        }
    </script>

</body></html>
